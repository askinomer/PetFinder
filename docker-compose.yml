# Apple Silicon (M1 / M2 / M3 / M4 Pro) compatible
# Azure SQL Edge runs natively on ARM64 — perfect for Mac dev environments.
version: "3.8"

services:
  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: petfinder-sqledge
    platform: linux/arm64
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqldata:
